  - other_tags
  - untagged
  candidate: not S5 and S1 and S3 and (S2 or S4)
  signals:
    S1:
      metric_families:
      - ^(RMSE|RMSLE|MAE|MSE|MAPE|SMAPE|R2Score|RValue|NormalizedGini|NormalizedWeightedGini|LogLoss|MulticlassLoss|MulticlassLossOld|WeightedMulticlassLoss|MeanColumnwiseLogLoss|WeightedMeanColumnwiseLogLoss|AUC|MCAUC|WeightedAUC|CategorizationAccuracy|WeightedCategorizationAccuracy|FScoreMacro|FScoreMicro|FScoreBetaMicro|F_\{Beta\}
        \(deprecated\)|FScore_1 \(deprecated\)|MCRMSE|MCRMSLE|MWCRMSE|MeanColumnwiseMAE|CRPS|WeightedPinballLoss|WeightedRowwisePinballLoss|M5_WRMSSE|SpearmanR|MeanPearson|PearsonCorrelationCoefficient|QuadraticWeightedKappa|MatthewsCorrelationCoefficient|NDCG@\{K\}|MAP@k|MAP@\{K\}|MAP@\{K\}_OLD|WeightedRecall@\{K\}|ZillowMAE|WMAE|NWRMSLE|RootMeanSquarePercentageError|GroupMeanLogMAE|PercentCorrectVisits|AverageAmongTopP|HiggsBosonApproximateMedianSignificance|TwoSigmaNews|JaneStreetPnl|AmexGiniAndPercentageCaptureX|LaplaceLogLikelihood|MCAP|WRRMSE)$
      name_patterns:
      - (?i)^(mean squared error|mean absolute error|mean squared log error|r2 score|roc
        auc score|accuracy score|balanced accuracy score|cohen kappa score|log loss|matthews
        corrcoef|f1 score|mean absolute percentage error|sklearn_roc_auc_score|sklearn_average_precision_score|kullback
        leibler divergence|smape_plus_1)$|sharpe|gini|concordance|commodity prediction|march
        mania|nfl_|polymer|wildfire|zero-mean r2|mean weighted columnwise aucroc
    S2:
      file_patterns:
      - \.(csv|parquet|feather|tsv|xlsx?)\b
      media_patterns:
      - \.(jpe?g|png|tiff?|bmp|dcm|dicom|nii(\.gz)?|svs|wav|mp3|flac|ogg|aiff?|mp4|avi|mov|mkv|tfrecords?)\b
      strip_patterns:
      - <img[^>]*>
      - '!\[[^\]]*\]\([^)]*\)'
      - https?://\S+
    S3:
      media_patterns:
      - \.(jpe?g|png|tiff?|bmp|dcm|dicom|nii(\.gz)?|svs|wav|mp3|flac|ogg|aiff?|mp4|avi|mov|mkv|tfrecords?)\b
