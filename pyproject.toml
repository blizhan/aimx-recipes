[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aimx-recipes"
version = "0.1.0"
description = "Core schemas, facet vocabulary, and offline contract validation for aimx recipes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26,<5",
    "referencing>=0.37,<0.38",
    "rfc3339-validator>=0.1.4,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aimx_recipes"]
exclude = ["src/aimx_recipes/_schemas"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "aimx_recipes/_schemas"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
